
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Fabric Patterns</title>
<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    
}
.container {
    background-color: rgba(255, 255, 255, 0.8);
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 600px;
    width: 90%;
}
h1 { color: #333; margin-bottom: 10px; }
.links { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.links a, button {
    display: inline-block;
    margin: 0;
    padding: 10px 20px;
    text-decoration: none;
    color: #fff;
    background-color: #007bff;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}
.links a:hover, button:hover { background-color: #0056b3; }

/* Animations */
@keyframes spin { 0%{background-position:0 0}100%{background-position:200% 200%} }
@keyframes silkMove { 0%{background-position:0% 0%}50%{background-position:100% 100%}100%{background-position:0% 0%} }
@keyframes rotateBox { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
</style>
<script src="assets/js/demo-auth.js" defer></script></head>
<body>
<div class="container">
    <h1>CSS Fabric Patterns</h1>
    <p>Click a link below to change the background style, generated purely with CSS.</p>

    <div class="links">
        
            <a href="?style="></a>
        
    </div>

    <h2>CSS for current style:</h2>
    <pre></pre>
</div>
<div id="demo-auth-footer"></div><script>document.addEventListener("DOMContentLoaded",()=>DemoAuth&&DemoAuth.renderFooter("#demo-auth-footer"));</script></body>
</html>
