<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Display — UWEC Demo</title>
<link rel="stylesheet" href="assets/css/main.css">
<script src="assets/js/demo-auth.js" defer></script>
</head>
<body>
<main class="container">
<h1>Content Display</h1>
<p class="demo-note">Static demo page.</p>


<section>
    <h2>Clipboard Catcher</h2>
    <form id="clipboard-form">
        <button id="paste-button">Paste Clipboard Content</button>
    </form>
    <h3>Uploaded Files:</h3>
    <ul id="uploaded-files">
        
            <li></li>
        
    </ul>
    <div id="preview-container"></div>
</section>

<script>
const pasteButton = document.getElementById('paste-button');
const uploadedFilesList = document.getElementById('uploaded-files');
const previewContainer = document.getElementById('preview-container');

// Fetch uploaded files
function fetchUploadedFiles() {
    fetch('?list=1')
    .then(r => r.text())
    .then(html => {
        uploadedFilesList.innerHTML = html;
    });
}

pasteButton.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
        const clipboardContent = await navigator.clipboard.read();
        const file = clipboardContent[0];
        const fileReader = new FileReader();
        fileReader.onload = () => {
            const previewContent = document.createElement('div');
            previewContent.innerHTML = `
                <img src="${fileReader.result}" style="max-width: 100%; max-height: 200px;">
                <button id="upload-button">Upload</button>
                <button id="discard-button">Discard</button>
            `;
            previewContainer.innerHTML = '';
            previewContainer.appendChild(previewContent);

            document.getElementById('upload-button').addEventListener('click', () => {
                const formData = new FormData();
                formData.append('clipboardContent', file);
                fetch('?upload=1', {
                    method: 'POST',
                    body: formData,
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        fetchUploadedFiles();
                        previewContainer.innerHTML = '';
                    }
                });
            });

            document.getElementById('discard-button').addEventListener('click', () => {
                previewContainer.innerHTML = '';
            });
        };
        fileReader.readAsDataURL(file);
    } catch (error) {
        // Handle text clipboard content
        navigator.clipboard.readText().then(text => {
            const previewContent = document.createElement('div');
            previewContent.innerHTML = `
                <textarea style="width: 100%; height: 200px;">${text}</textarea>
                <button id="upload-button">Upload</button>
                <button id="discard-button">Discard</button>
            `;
            previewContainer.innerHTML = '';
            previewContainer.appendChild(previewContent);

            document.getElementById('upload-button').addEventListener('click', () => {
                const formData = new FormData();
                formData.append('clipboardText', text);
                fetch('?upload=1', {
                    method: 'POST',
                    body: formData,
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        fetchUploadedFiles();
                        previewContainer.innerHTML = '';
                    }
                });
            });

            document.getElementById('discard-button').addEventListener('click', () => {
                previewContainer.innerHTML = '';
            });
        });
    }
});
</script>

</main>
<div id="demo-auth-footer"></div>
<script>document.addEventListener('DOMContentLoaded',()=>DemoAuth&&DemoAuth.renderFooter('#demo-auth-footer'));</script>
</body>
</html>
