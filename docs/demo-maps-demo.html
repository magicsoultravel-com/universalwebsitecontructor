<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maps Demo — UWEC Demo</title>
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/demo-auth.js" defer></script>
</head>
<body>
<main class="container">
<h1>Maps Demo</h1>
<p class="demo-note">Static Leaflet map — click to add markers (saved in browser).</p>
<div id="map" style="height:500px;border-radius:12px"></div>
<button type="button" id="clear-markers" style="margin-top:12px">Clear markers</button>
</main>
<div id="demo-auth-footer"></div>
<script>
const KEY = 'uwec-map-markers';
document.addEventListener('DOMContentLoaded', () => {
  const map = L.map('map').setView([51.5, -0.1], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function save(m) { localStorage.setItem(KEY, JSON.stringify(m)); }
  function redraw() {
    layer.clearLayers();
    load().forEach(m => L.marker([m.lat, m.lng]).addTo(layer).bindPopup(m.label || 'Marker'));
  }
  map.on('click', e => {
    const label = prompt('Marker label') || 'Marker';
    const m = load(); m.push({ lat: e.latlng.lat, lng: e.latlng.lng, label }); save(m); redraw();
  });
  document.getElementById('clear-markers').onclick = () => { save([]); redraw(); };
  redraw();
  DemoAuth.renderFooter('#demo-auth-footer');
});
</script>
</body>
</html>
